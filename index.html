<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>D&amp;D Dice Roller</title>
    <link rel='stylesheet' href='style.css'>
</head>

<body>
    <main class='card'>
        <div class='header'>
            <h1>D&amp;D Dice Roller</h1>
        </div>

        <div class='instructions'>
            <p>
            Press <b>Roll Dice</b>- or just press Enter- to simulate a roll of a 20-sided die.
            </p>
        </div>
        <hr>

        <section class='dice-result'>
            <h2>Result</h2>
            <label for='diceResult'>Roll:</label>
            <input type='text' id='diceResult' class='die-value' readonly>
        </section>

        <button id='rollButton' type='button' autofocus onclick='roll()'>
            🌟⚔️ Roll Dice ⚔️🌟
        </button>
        <hr>

        <section class='cors-test'>
            <button type='button' class='secondary' onclick='testCorsFailure()'>Test CORS Failure</button>
            <p id='corsResult'></p>
        </section>


    </main>
    
    <script src='script.js' defer></script>

</body>


</html>
